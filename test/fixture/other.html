<!doctype html>
<html lang="en">
<head>

  <title>Example (not Shopify)</title>
  <style>body { font-family: sans-serif; margin: 40px; } nav { position: fixed; left: 0; top: 0; width: 220px; }</style>
</head>
<body>

</body>
</html>
